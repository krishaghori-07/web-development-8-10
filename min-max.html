<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Min-max</title>
</head>
<body>
    <form action="Success.html">
        <table border="1" cellpadding="10" width="100%" bgcolor="#eeeee">
            <tr>
                <td>
                    <label for="source">
                        Source
                    </label>
                    <input type="text" name="source" id="source" required>
                </td>
                <td>
                    <label for="destination">
                        Destination
                    </label>
                    <input type="text" name="destination" id="destination">
                </td>
                <td>
                    <label for="jorneydate">
                        Date
                    </label>
                    <input type="date" name="journeydate" id="jorneydate" required min="2026-07-26" max="2026-10-25">
                </td>
                <td>
                    <label for="seats">Seates</label>
                    <input type="number" name="seates" id="seates" required min="1" max="5">
                </td>
                <td>
                    <label for="">bus type</label>
                    <br>
                    <label for="express">
                        <input type="checkbox" name="express" id="express" value="1">Express
                    </label>
                    <br>
                    <label for="volvo">
                        <input type="checkbox" name="volvo" id="volvo" value="3">Volvo
                    </label>
                    <br>
                    <label for="sleeper">
                        <input type="checkbox" name="sleeper" id="sleeper" value="4">Sleeper
                    </label>
                </td>
                <td>
                    <label for="">Select gender</label>
                    <br>
                    <label for="male">
                        <input type="radio" id="male" value="1" name="gender">Male
                    </label>
                    <br>
                    <label for="female">
                        <input type="radio" id="female" value="1" name="gender">Female
                    </label>
                </td>
                <td>
                    <input type="submit" value="search">
                    
                </td>
            
            </tr>

        </table>
    </form>
</body>
</html>
