<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>counter machine</title>
    <style>
        body{
            font-family:Arial;
            background:lavender;
            text-align: center;
            padding-top:70px;
        }
        .container{
            width:450px;
            margin:auto;
            padding:40px;
            background:white;
            border-radius:25px;
            box-shadow:0 5px 20px gray;
        }
        h2{
            font-size:35px;
            color:purple;
        }
        .count{
            background:#eee5ff;
            padding:20px;
            border-radius:20px;
            margin:25px 0;
        }
        .count h1{
            font-size:75px;
            color:purple;
            margin:10px;
        }
        button{
            width:100%;
            height:85px;
            font-size:30px;
            font-weight: bold;
            border:none;
            border-radius:15px;
            cursor: pointer;
            margin:10px 0;
        }
        .add{
            background:purple;
            color:white;
        }
        .substract{
            background:#eeeeee;
            color: purple;
        }
        .reset{
            background:#ffe0e0;
            color:red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>counter machine</h2>
         <div class="count">
            <p>your count</p>
            <h1>0</h1>
         </div>
         <button class="add">+ ADD ONE POINT</button>
         <button class="substract">-SUBSTRACT</button>
         <button class="reset">RESET</button>
    </div>
</body>
</html>
