<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>style store</title>
    <link rel="stylesheet" href="style4.css">
</head>
<body>
   <header>
    <h1>STYLE<span>STORE</span></h1>
    <nav>
        <a href="#">Home</a>
        <a href="#products">Products</a>
        <a href="#">contact</a>
    </nav>
   </header> 
   <section class="hero">
    <h2>upgrade your style</h2>
    <p>Discover products you'll love.</p>
    <a href="#products" class="shop-btn">Shop now</a>
   </section>
    <section id="products" class="products">
        <h2>our products</h2>
        <div class="product-grid">
            <div class="product-card">
                <div class="image-box">
                    <img src="https://picsum.photos/300?random=1" alt="wireless headphones">
                </div>
                <div class="product-info">
                    <span class="category">Electronics</span>
                    <h3>wireless headphones</h3>
                    <p class="price">$2,532</p>
                    <button>Buy Now</button>
                </div>
            </div>
            <div class="product-card">
                <div class="image-box">
                    <img src="https://picsum.photos/300?random=2" alt="red sports shoe">
                </div>
                <div class="product-info">
                    <span class="category">Fashion</span>
                    <h3>sports sneakers</h3>
                    <p class="price">$23,456</p>
                    <button>Buy Now</button>
                </div>
            </div>
            <div class="product-card">
                <div class="image-box">
                    <img src="https://picsum.photos/300?random=3" alt="classic wristwatch">
                </div>
                <div class="product-info">
                    <span>Accessories</span>
                    <h3>classic wristwatch</h3>
                    <p class="price">$2,456</p>
                    <button>Buy Now</button>
                </div>
            </div>
        </div>
    </section> 
    <footer>
        <p>
            &#xa9; 2026 stylestore | shop with style
        </p>
    </footer>
</body>
</html>
