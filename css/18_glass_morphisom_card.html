<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>glass profile card</title>
    <link rel="stylesheet" href="style_5.css">
</head>
<body>
    <div class="background-circle circle1">
    </div>
    <div class="background-circle circle2">
    </div>

    <div class="profile-card">
        <div class="profile-image">
            <img src="https://picsum.photos/300?random=1" alt="profile-photo">
        </div>
        <h1>abc</h1>
        <p class="role">frontend developer</p>
        <p class="discription">
            i create beutiful ,modern and responsive websites using html,css and javascript.
        </p>
        <div class="stats">
            <div>
                <h3>15</h3>
                <span>projects</span>
            </div>
            <div>
                <h3>2.5k</h3>
                <span>follower</span>
            </div>
            <div>
                <h3>120</h3>
                <span>following</span>
            </div>
        </div>
        <button>view profile</button>
    </div>

</body>
</html>
