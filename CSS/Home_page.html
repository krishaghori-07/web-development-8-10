<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            margin:0;
            font-family: Arial, Helvetica, sans-serif;
            background-color: #f0f8ff;
        }
        nav{
            background-color: #333;
            padding:20px;
            text-align: center;
        }
        nav a{
            color:white;
            text-decoration: none;
            margin: 20px;
            font-size: 18px;
        }
        nav a:hover{
            color:yellowgreen;
        }
        .home button:hover{
            background-color: purple;
        }
        /*cards*/
        .container{
            display:flex;
            justify-content: center;
            gap: 20px;
            padding:40px;
        }
        .card:hover{
            background-color: lightyellow;
        }
        /*footer*/
        footer{
            background-color: #333;
            padding:15px;
            text-align:center;
            color:rgb(250, 242, 242);
        }
    </style>
</head>
<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Services</a>
        <a href="#">Contact</a>
    </nav>
    <div class="home">
        <h1>Welcome to my website!</h1>
        <p>Learn,explore and create something amazing</p>
        <button>Get started</button>
    </div>
    <div class="container">
        <div class="card">
            <h2>HTML</h2>
            <P>Create te structure of a website.</P>
        </div>
        <div class="card">
            <h2>CSS</h2>
            <P>Make your website beautiful.</P>
        </div>
        <div class="card">
            <h2>Javascript</h2>
            <P>Add functionality to your website. </P>
        </div>
    </div>
    <footer>
        <p>&#xa9;My website | All Rights Reserved.</p>
    </footer>
</body>
</html>
