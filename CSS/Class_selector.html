<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class selector</title>
    <style>
        *{
            margin:0px;
            padding: 0px;
            letter-spacing: 1px;
            font-size: 17px;
        }
        h1{
            font-size: 2rem;
            text-transform: uppercase;
            text-align: center;
            text-decoration: underline;
        }
        .horror{
            background-color: #b5e7a0;
            color:#86af49;
        }
        .hindu{
            background-color: #e6e2d3;
            color:brown;

        }
        .horror,.hindu{
            padding: 10px;
            border: 1px solid black;
            width:70%;
            margin:auto;
            margin-bottom: 10px;
        }
        .horror-font{
            font-family: "crrepster",system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        .hindu-font{
            font-family: "Merriweather sans",sans-serif;
        }
    </style>
</head>
<body>
    <section>
        <article class="horror horror-font">
            <header>
                <h1>The haunted library</h1>
            </header>
            <p>
                
            </p>
        </article>
    </section>
</body>
</html>
