<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pseudo class</title>
    <style>
        a:link{
            color:blue;
        }
        a:visited{
            color: purple;
        }
        a:hover{
            color:red;
            font-size: 25px;
        }
        a:active{
            color:red;
        }
    </style>
</head>
<body>
    <h1>CSS link pseudo class</h1>
    <a href="https://www.google.com/">Google</a>
    <a href="https://www.youtube.com/">Youtube</a>
</body>
</html>
